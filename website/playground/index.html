<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferrite Playground - Try Ferrite in Your Browser</title>
    <meta
      name="description"
      content="Write and execute Ferrite code directly in your browser with our interactive playground."
    />
    <meta
      name="keywords"
      content="Ferrite, Programming Language, Compiler, Systems Programming, Machine Learning"
    />
    <meta name="author" content="Vishwanath M M" />
    <link rel="canonical" href="https://ferrite-lang.org/playground/" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Ferrite Playground - Try Ferrite in Your Browser"
    />
    <meta
      property="og:description"
      content="Write and execute Ferrite code directly in your browser with our interactive playground."
    />
    <meta property="og:url" content="https://ferrite-lang.org/playground/" />
    <meta
      property="og:image"
      content="https://ferrite-lang.org/assets/images/logo.png"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Ferrite Playground - Try Ferrite in Your Browser"
    />
    <meta
      name="twitter:description"
      content="Write and execute Ferrite code directly in your browser with our interactive playground."
    />
    <meta
      name="twitter:image"
      content="https://ferrite-lang.org/assets/images/logo.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/style.css?v=9" />
  </head>

  <body>
    <div class="blob-bg-1"></div>
    <div class="blob-bg-2"></div>

    <!-- Shared Header (loaded via JS) -->
    <div id="header-slot"></div>

    <main class="page-container">
      <div class="page active">
        <section class="playground-section container">
          <div class="playground-layout">
            <!-- Right Code Editor and Console -->
            <div class="play-editor-container">
              <div class="play-editor-header glass">
                <div class="editor-title font-mono">
                  <div class="custom-dropdown" id="preset-dropdown">
                    <div class="dropdown-selected">
                      <span id="dropdown-current">Hello, Ferrite!</span>
                      <svg
                        class="chevron"
                        width="12"
                        height="12"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <polyline points="6 9 12 15 18 9"></polyline>
                      </svg>
                    </div>
                    <ul class="dropdown-options font-mono" id="preset-options">
                      <li data-value="hello" class="active">Hello, Ferrite!</li>
                      <li data-value="tensors">Tensor Multiplications</li>
                      <li data-value="matching">Match Guards & Enums</li>
                      <li data-value="traits">Traits & Groups</li>
                      <li data-value="closures">Closures & Loops</li>
                      <li class="divider"></li>
                      <li data-value="blank">✨ New File</li>
                    </ul>
                  </div>
                </div>
                <div class="editor-actions">
                  <button id="btn-run" class="btn btn-primary">
                    <span class="icon">▶</span> Run Code
                  </button>
                  <button id="btn-clear" class="btn btn-secondary">
                    Clear Output
                  </button>
                </div>
              </div>

              <div class="play-workspace">
                <!-- Code Area -->
                <div class="code-area">
                  <div class="line-numbers font-mono" id="editor-lines">
                    1<br />2<br />3<br />4<br />5
                  </div>
                  <textarea
                    id="code-editor"
                    class="font-mono"
                    spellcheck="false"
                  >
println("Hello, Ferrite!");</textarea
                  >
                </div>

                <!-- Console Output -->
                <div class="console-area">
                  <div class="console-header font-mono">Console Output</div>
                  <div class="console-body font-mono" id="console-output">
                    <span class="comment"
                      >// Press 'Run Code' to execute sandbox.fe...</span
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Shared Footer (loaded via JS) -->
    <div id="footer-slot"></div>

    <!-- Scripts -->
    <script src="/assets/js/layout.js?v=3"></script>
    <script src="/assets/js/script.js?v=2"></script>
  </body>
</html>
