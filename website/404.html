<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found • Ferrite</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/assets/css/style.css?v=5" />
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon" />
  </head>
  <body
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    "
  >
    <div
      class="glass"
      style="
        max-width: 500px;
        width: 100%;
        text-align: center;
        padding: 3rem 2rem;
      "
    >
      <span
        style="
          font-size: 5rem;
          line-height: 1;
          display: block;
          margin-bottom: 1rem;
        "
        >🔍</span
      >
      <h1
        style="
          font-size: 3rem;
          font-weight: 800;
          margin-bottom: 0.5rem;
          letter-spacing: -1px;
          color: var(--accent-primary);
        "
      >
        404
      </h1>
      <h2
        style="
          font-size: 1.5rem;
          font-weight: 700;
          margin-bottom: 1rem;
          color: var(--text-primary);
        "
      >
        Page Not Found
      </h2>
      <p
        style="
          color: var(--text-secondary);
          margin-bottom: 2rem;
          font-size: 0.95rem;
          line-height: 1.5;
        "
      >
        The page or resource you requested does not exist or has moved.
      </p>
      <a
        href="/"
        class="btn btn-primary classic-btn"
        style="text-decoration: none"

      >
    </div>
